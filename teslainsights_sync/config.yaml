name: TeslaInsights Sync
version: "0.1.0"
slug: teslainsights_sync
description: Skickar TeslaMate-, Tibber- och Home Assistant-data till TeslaInsights-backenden med HMAC-signerade batchar.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant_api: true
options:
  api_url: "https://api.leott.se/tesla"
  hmac_secret: ""
  teslamate:
    host: ""
    port: 5432
    database: teslamate
    user: ti_reader
    password: ""
  sync_interval_seconds: 300
  position_interval_seconds: 10
  charge_sample_interval_seconds: 60
  stale_open_hours: 48
  tibber_token: ""
  ha_entities: []
  ha_backfill_days: 10
  log_level: info
schema:
  api_url: url
  hmac_secret: password
  teslamate:
    host: str
    port: port
    database: str
    user: str
    password: password
  sync_interval_seconds: int(60,86400)
  position_interval_seconds: int(1,600)
  charge_sample_interval_seconds: int(1,3600)
  stale_open_hours: int(1,720)
  tibber_token: password
  ha_entities:
    - str
  ha_backfill_days: int(0,30)
  log_level: list(debug|info|warning|error)
